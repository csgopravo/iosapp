name: Build WebClip IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tạo file IPA
        run: |
          # Tạo thư mục WebClip.app
          mkdir -p WebClip.app
          
          # Tạo file Info.plist
          cat > WebClip.app/Info.plist <<EOL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDisplayName</key>
              <string>Tài Xỉu Tool</string>
              <key>CFBundleIdentifier</key>
              <string>com.yourname.taixiu</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>MainHTML</key>
              <string>https://username.github.io/repository-name/</string>
          </dict>
          </plist>
          EOL
          
          # Nén thành file .ipa
          zip -r WebClip.ipa WebClip.app
          
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WebClip.ipa
          path: WebClip.ipa
