name: Build iOS WebClip
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v2
    
    - name: Tạo WebClip
      run: |
        mkdir -p WebClip.app
        cat > WebClip.app/Info.plist <<EOL
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>CFBundleDisplayName</key>
            <string>Tai Xiu Tool</string>
            <key>CFBundleIdentifier</key>
            <string>com.tenban.taixiu</string>
            <key>CFBundleVersion</key>
            <string>1.0</string>
            <key>MainHTML</key>
            <string>index.html</string>
        </dict>
        </plist>
        EOL
        
        mkdir -p WebClip.app/Resources
        cp index.html WebClip.app/Resources/
        
        # Tạo icon đơn giản (không bắt buộc)
        convert -size 512x512 xc:blue -fill white -pointsize 72 -gravity center -draw "text 0,0 'TX'" WebClip.app/Resources/icon.png
        
        # Nén thành file IPA
        zip -r WebClip.ipa WebClip.app
    - uses: actions/upload-artifact@v2
      with:
        name: WebClip
        path: WebClip.ipa
